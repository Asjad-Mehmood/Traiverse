<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Traverse &amp; Level</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f1e7; color: #142033;
         font: 15px/1.55 "Segoe UI", system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { body { background: #0b1426; color: #e8e2d4; } .card { background: #13203a; border-color: #263655; } }
  .card { max-width: 440px; margin: 16px; padding: 32px; background: #fffdf8; border: 1px solid #e6dcc6; border-radius: 16px; text-align: center; }
  h1 { margin: 12px 0 8px; font: 600 24px/1.2 Georgia, serif; }
  p { margin: 0 0 20px; opacity: .8; }
  button { font: 600 15px "Segoe UI", sans-serif; padding: 10px 22px; border: 0; border-radius: 10px; cursor: pointer;
           background: linear-gradient(#e2c06a, #b48a2c); color: #1d1606; }
</style>
</head>
<body>
  <div class="card">
    <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><g fill="#c9a24a"><path d="M32 2l5 25 25 5-25 5-5 25-5-25-25-5 25-5z"/></g><circle cx="32" cy="32" r="14" fill="none" stroke="#c9a24a" stroke-width="2"/></svg>
    <h1>Connect to the internet once</h1>
    <p>The first time it opens, Traverse &amp; Level needs the internet to sign you in and fetch the app.
       After that it also opens without a connection.</p>
    <button onclick="location.href='{{APP_URL}}'">Try again</button>
  </div>
</body>
</html>
